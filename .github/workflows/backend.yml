name: Mock backend contracts and HTTP tests
on:
  pull_request:
    paths: ['backend/**', 'contracts/**', 'tools/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'contracts/**', 'tools/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            tools/requirements-contracts.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python tools/check_contracts.py
      - run: python -m pytest backend/tests -q --junitxml=backend/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7
