name: Android build and unit tests
on:
  pull_request:
    paths: ['android/**', 'contracts/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'contracts/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Android command-line tools and SDK
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$archive"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools" "$RUNNER_TEMP/android-tools"
          unzip -q "$archive" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :core-contracts:test :core-vision:testDebugUnitTest :core-network:testDebugUnitTest :feature-tryon:testDebugUnitTest :app:lintDebug :core-vision:lintDebug :core-network:lintDebug :feature-tryon:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/**/build/reports/
          retention-days: 7
